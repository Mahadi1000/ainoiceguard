name: Feature request
description: Suggest an idea or an improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please check that it is not already
        [requested](https://github.com/Mahadi1000/ainoiceguard/issues?q=is%3Aissue+label%3Aenhancement).
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation and what gets in the way today.
      placeholder: "I always forget to turn Ainoiceguard on before a call..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Your idea
      description: How should it work? Mock-ups or examples from other apps are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: platforms
    attributes:
      label: Which platforms does this matter on?
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself (a maintainer will confirm the approach first).
