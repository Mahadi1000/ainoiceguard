name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Force HTTPS for GitHub git dependencies
        run: |
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"

      - name: Install dependencies
        run: npm ci

      - name: Install system build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libasound2-dev

      - name: Build native addon
        run: bash ./scripts/build-native-linux.sh

      - name: Run tests
        run: npm run test:ci

      - name: Build Linux distributables
        run: npm run dist:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ainoiceguard-linux
          path: dist/linux/**

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ainoiceguard-linux
          path: release-artifacts
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
