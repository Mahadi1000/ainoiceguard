name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Force HTTPS for GitHub git dependencies
        run: |
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
      - run: npm ci
      - run: npm run check:package
      - run: npm run test:ci
      - run: bash -n ./scripts/build-native-linux.sh

  bench-golden:
    # Builds the offline ng_bench tool and checks RNNoise output against the
    # stored golden files in test/golden/ (regression guard for the baseline).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libasound2-dev
      - name: Build ng_bench
        run: |
          cmake -S native -B deps/bench-build -DCMAKE_BUILD_TYPE=Release -DNG_BUILD_BENCH=ON
          cmake --build deps/bench-build --target ng_bench ng_engine_tests --parallel
      - name: Golden regression + native unit tests
        env:
          NG_BENCH_REQUIRED: '1'
          NG_BENCH_BIN: deps/bench-build/ng_bench
          NG_ENGINE_TESTS_BIN: deps/bench-build/ng_engine_tests
        run: node --test --test-reporter=spec test/golden.test.js test/native-unit.test.js

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Force HTTPS for GitHub git dependencies
        run: |
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
      - run: npm ci
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libasound2-dev pkg-config \
            fakeroot rpm libarchive-tools
      - name: Cache native deps
        uses: actions/cache@v4
        with:
          path: deps/install
          key: linux-deps-${{ hashFiles('native/CMakeLists.txt', 'scripts/build-native-linux.sh') }}
      - name: Build native addon
        run: npm run build:native:unix
      - name: Rebuild native addon for Electron ABI
        run: npm run rebuild:electron
      - name: Build Linux distributables
        run: npm run dist:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ainoiceguard-linux
          path: |
            dist/linux/*.AppImage
            dist/linux/*.deb
            dist/linux/*.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Force HTTPS for GitHub git dependencies
        run: |
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
      - run: npm ci
      - name: Install cmake
        run: brew install cmake
      - name: Cache native deps
        uses: actions/cache@v4
        with:
          path: deps/install
          key: macos-deps-${{ hashFiles('native/CMakeLists.txt', 'scripts/build-native-linux.sh') }}
      - name: Build native addon
        run: npm run build:native:unix
      - name: Rebuild native addon for Electron ABI
        run: npm run rebuild:electron
      - name: Build macOS distributables
        run: npm run dist:mac
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ainoiceguard-macos
          path: |
            dist/mac/*.dmg
            dist/mac/*.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Force HTTPS for GitHub git dependencies
        run: |
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
      - run: npm ci
      - name: Cache native deps
        uses: actions/cache@v4
        with:
          path: deps/install
          key: windows-deps-${{ hashFiles('native/CMakeLists.txt', 'scripts/build-native.ps1') }}
      - name: Build native addon
        run: npm run build:native
      - name: Rebuild native addon for Electron ABI
        run: npm run rebuild:electron
      - name: Build Windows distributables
        run: npx electron-builder --win --x64 --publish never --config.directories.output=dist/win --config.npmRebuild=false
      - name: Verify installer contents
        run: node scripts/verify-dist.js dist/win
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ainoiceguard-windows
          path: |
            dist/win/*.exe
            dist/win/*.exe.blockmap
            dist/win/latest.yml

  release:
    # Run on tag pushes. Requires the tests and the Windows build (primary
    # target). Linux and macOS are best-effort: their failure does not block
    # the release, but the job waits for them so their files are attached.
    # Waits for all three builds; publishes if Windows succeeded.
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build-windows.result == 'success' && needs.test.result == 'success'
    needs: [test, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.js "${{ github.ref_name }}" > release-notes.md
      - uses: actions/download-artifact@v4
        with:
          name: ainoiceguard-windows
          path: release-artifacts/windows
      - name: Download Linux artifacts (if available)
        uses: actions/download-artifact@v4
        with:
          name: ainoiceguard-linux
          path: release-artifacts/linux
        continue-on-error: true
      - name: Download macOS artifacts (if available)
        uses: actions/download-artifact@v4
        with:
          name: ainoiceguard-macos
          path: release-artifacts/macos
        continue-on-error: true
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          name: Ainoiceguard ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release-artifacts/windows/*.exe
            release-artifacts/windows/*.exe.blockmap
            release-artifacts/windows/latest.yml
            release-artifacts/linux/*.AppImage
            release-artifacts/linux/*.deb
            release-artifacts/linux/*.tar.gz
            release-artifacts/macos/*.dmg
            release-artifacts/macos/*.zip
