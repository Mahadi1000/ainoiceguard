name: CI

on:
  push:
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Force HTTPS for GitHub git dependencies
        run: |
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
      - run: npm ci
      - run: npm run check:package
      - run: npm run test:ci
      - run: bash -n ./scripts/build-native-linux.sh

  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Force HTTPS for GitHub git dependencies
        run: |
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
      - run: npm ci
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libasound2-dev
      - name: Build native addon
        run: npm run build:native:unix
      - name: Build Linux distributables
        run: npm run dist:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ainoiceguard-linux
          path: dist/linux/**

  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Force HTTPS for GitHub git dependencies
        run: |
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
      - run: npm ci
      - name: Install cmake
        run: brew install cmake
      - name: Build native addon
        run: npm run build:native:unix
      - name: Build macOS distributables
        run: npm run dist:mac
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ainoiceguard-macos
          path: dist/mac/**

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Force HTTPS for GitHub git dependencies
        run: |
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
      - run: npm ci
      - name: Build native addon
        run: npm run build:native
      - name: Build Windows distributables
        run: npm run dist:win
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ainoiceguard-windows
          path: dist/win/**

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
